<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Know when your people are free to talk, never where they are. Talk to Kizuna the way you think; it remembers the people in your notes and, at a good moment, hands you a ready WhatsApp line and a time that works." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Kizuna" />
		<meta property="og:title" content="Kizuna: know when your people are free to talk" />
		<meta property="og:description" content="Not where they are. Talk it out, and Kizuna nudges you with a ready WhatsApp line and a time that works. Nothing for your family to install. No streaks, no scores." />
		<meta property="og:url" content="https://kizuna.siddharth77work.workers.dev/" />
		<meta property="og:image" content="https://kizuna.siddharth77work.workers.dev/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Kizuna: know when your people are free to talk. Never where they are." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Kizuna: know when your people are free to talk" />
		<meta name="twitter:description" content="Not where they are. A ready WhatsApp line and a time that works. No streaks, no scores." />
		<meta name="twitter:image" content="https://kizuna.siddharth77work.workers.dev/og.png" />
		<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Kizuna" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<title>Kizuna</title>
		<script>
			// Apply the saved theme before first paint so there is no flash.
			try {
				var t = localStorage.getItem('kizuna-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
